<main class="checkout">
  <div class="checkout__container">
    <h3 class="checkout__title">Place Your Order</h3>
    <input class="checkout__input" type="text" id="customer-name" placeholder="Your Name" required>
    <input class="checkout__input" type="tel" id="customer-phone" placeholder="Phone Number" required>
    <input class="checkout__input" type="text" id="customer-card" placeholder="Card Number" required>
    <input class="checkout__input" type="text" id="customer-cvv" placeholder="CVV" required>
    <textarea class="checkout__textarea" id="customer-address" rows="3" placeholder="Delivery Address" required></textarea>
    <button class="checkout__btn" onclick="submitOrder()">Submit Order</button>
    <div class="checkout__success" id="success-message"></div>
  </div>
</main>
<script>
  function submitOrder() {
    let name = document.getElementById('customer-name').value.trim();
    let phone = document.getElementById('customer-phone').value.trim();
    let card = document.getElementById('customer-card').value.trim();
    let cvv = document.getElementById('customer-cvv').value.trim();
    let address = document.getElementById('customer-address').value.trim();
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    if (!name || !phone || !card || !cvv || !address) {
      alert("⚠️ Please fill in all fields!");
      return;
    }
    if (cart.length === 0) {
      alert("🛒 Your cart is empty!");
      return;
    }

    let total = cart.reduce((sum, item) => sum + item.price * (item.quantity || 1), 0);
    let orders = JSON.parse(localStorage.getItem('orders')) || [];
    orders.push({
      name,
      phone,
      address,
      cart,
      total,
      date: new Date().toLocaleString()
    });
    localStorage.setItem('orders', JSON.stringify(orders));
    localStorage.removeItem('cart');

    let itemsList = cart.map(it => `${it.name} × ${it.quantity || 1}`).join("<br>");
    let message = `
      ✅ Thank you for your order!<br><br>
      👤 Name: <b>${name}</b><br>
      ☎️ Phone: <b>${phone}</b><br>
      📍 Address: <b>${address}</b><br>
      🍽️ Order:<br> ${itemsList}<br><br>
      💰 Total: <b>${total} ₸</b>
    `;

    let successBox = document.getElementById('success-message');
    successBox.innerHTML = message;
    successBox.style.display = "block";
  }
  function updateCartIndicator() {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
  let indicator = document.getElementById('cartCount');

  if (count > 0) {
    indicator.style.display = "inline-block";
    indicator.textContent = count;
  } else {
    indicator.style.display = "none";
  }
}
document.addEventListener("DOMContentLoaded", updateCartIndicator);

</script>
