<main class="cart">
  <h2 class="cart__title">Your Cart</h2>
  <table class="cart__table" id="cart-table">
    <thead class="cart__table-head">
      <tr class="cart__table-row">
        <th class="cart__table-cell">Dish</th>
        <th class="cart__table-cell">Price</th>
        <th class="cart__table-cell">Restaurant</th>
        <th class="cart__table-cell">Action</th>
      </tr>
    </thead>
    <tbody class="cart__table-body"></tbody>
  </table>
  <p class="cart__total" id="total-price"></p>
</main>
<script>
function renderCart() {
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const tbody = document.querySelector('.cart__table-body');
  tbody.innerHTML = "";
  let total = 0;
  cart.forEach((item, i) => {
    total += item.price * (item.quantity || 1);
    let tr = document.createElement('tr');
    tr.classList.add('cart__table-row');
    tr.innerHTML = `
      <td class="cart__table-cell">${item.name}</td>
      <td class="cart__table-cell">${item.price} ₸</td>
      <td class="cart__table-cell">${item.restaurant}</td>
      <td class="cart__table-cell">
        <button class="cart__remove-btn" onclick="removeItem(${i})">Remove</button>
      </td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('total-price').textContent = "Total: " + total + " ₸";
  let indicator = document.getElementById('cartCount');
  if (cart.length > 0) {
    indicator.style.display = "inline-block";
    indicator.textContent = cart.length;
  } else {
    indicator.style.display = "none";
  }
}

function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  cart.splice(index, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}
window.onload = renderCart;
</script>
