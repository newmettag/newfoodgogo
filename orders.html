<main class="orders">
  <h2 class="orders__title">Your Orders</h2>
  <div id="orders-list" class="orders__list"></div>
</main>
<script>
function loadOrders() {
  let orders = JSON.parse(localStorage.getItem('orders')) || [];
  let list = document.getElementById("orders-list");
  list.innerHTML = "";
  if (orders.length === 0) {
    list.innerHTML = "<p class='orders__empty'>You don't have any orders yet.</p>";
    return;
  }
  orders.forEach((order, index) => {
    let div = document.createElement("div");
    div.classList.add("order");
    div.innerHTML = `
      <h3 class="order__title">Order from ${order.date}</h3>
      <p class="order__info"><b>Name:</b> ${order.name}</p>
      <p class="order__info"><b>Phone:</b> ${order.phone}</p>
      <p class="order__info"><b>Address:</b> ${order.address}</p>
      <p class="order__subtitle"><b>Dishes:</b></p>
      <ul class="order__items">
        ${order.cart.map(item => `
          <li class="order__item">
            <img class="order__item-img" src="${item.image}" alt="${item.name}">
            <span class="order__item-text">${item.name} (${item.restaurant}) — ${item.price} ₸ × ${item.quantity || 1}</span>
          </li>
        `).join("")}
      </ul>
      <button class="order__delete-btn" onclick="deleteOrder(${index})">Delete Order</button>
    `;
    list.appendChild(div);
  });
}
function deleteOrder(index) {
  let orders = JSON.parse(localStorage.getItem('orders')) || [];
  if (!confirm("Are you sure you want to delete this order?")) return;
  orders.splice(index, 1);
  localStorage.setItem('orders', JSON.stringify(orders));
  loadOrders();
}
window.onload = loadOrders;
function updateCartIndicator() {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
  let indicator = document.getElementById('cartCount');

  if (count > 0) {
    indicator.style.display = "inline-block";
    indicator.textContent = count;
  } else {
    indicator.style.display = "none";
  }
}
document.addEventListener("DOMContentLoaded", updateCartIndicator);

</script>
